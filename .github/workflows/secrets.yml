name: Secrets Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-secret:
    runs-on: ubuntu-latest

    steps:
      - name: Verify secret is available
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          if [ -z "$GOOGLE_API_KEY" ]; then
            echo "Secret is missing"
            exit 1
          fi

          echo "Secret is configured successfully"
